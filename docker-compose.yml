version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: user-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shivamngenux
      POSTGRES_DB: user_management
    
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: user-backend
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 7000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: shivamngenux
      DB_NAME: user_management
    ports:
      - "7000:7000"

volumes:
  pgdata: